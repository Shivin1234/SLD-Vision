__include__:
  [
    "rtdetrv2/include/dataloader.yml",
    "rtdetrv2/include/optimizer.yml",
    "rtdetrv2/include/runtime.yml",
    "rtdetrv2/include/rtdetrv2_r50vd.yml",
  ]
output_dir: /content/drive/MyDrive/sld_bom_output/run2_img800
epoches: 60
checkpoint_freq: 30

eval_spatial_size: [800, 800]

remap_mscoco_category: False
num_classes: 11

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: false
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformerv2:
  num_classes: 11
  num_layers: 3

train_dataloader:
  total_batch_size: 16
  dataset:
    img_folder: /content/dataset/sld_bom/images/train/
    ann_file: /content/dataset/sld_bom/annotations/instances_train.json
    transforms:
      ops:
        - { type: RandomPhotometricDistort, p: 0.5 }
        - { type: RandomZoomOut, fill: 0 }
        - { type: RandomIoUCrop, p: 0.8 }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: RandomHorizontalFlip }
        - { type: Resize, size: [800, 800] }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: ConvertPILImage, dtype: "float32", scale: True }
        - { type: ConvertBoxes, fmt: "cxcywh", normalize: True }
      policy:
        epoch: 52
  collate_fn:
    scales: [608, 640, 672, 704, 736, 768, 800, 800, 800, 832, 864, 896]
    stop_epoch: 52

val_dataloader:
  dataset:
    img_folder: /content/dataset/sld_bom/images/val/
    ann_file: /content/dataset/sld_bom/annotations/instances_val.json
    transforms:
      ops:
        - { type: Resize, size: [800, 800] }
        - { type: ConvertPILImage, dtype: "float32", scale: True }

ema:
  decay: 0.999
  warmups: 500

lr_warmup_scheduler:
  warmup_duration: 300

lr_scheduler:
  type: MultiStepLR
  milestones: [48]
  gamma: 0.1
